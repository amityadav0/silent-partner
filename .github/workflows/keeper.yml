# Mainnet NAV keeper (NEEDS-AMIT §12 option A, D-P5-12). Every 4 h it posts the mainnet vault's NAV
# if the last accepted post is 3.5 h old or more, so the vault never reaches the 24 h emergency.
# Its key can call only post_nav on the vault (function-call key, 0.75 NEAR allowance); it never
# shields, trades or pays. A failed run means a post didn't land: GitHub emails the repo owner.
name: keeper
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      min_age_minutes:
        description: "Post if the last post is at least this old (the contract still needs 60)"
        default: "210"
concurrency:
  group: mainnet-keeper
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: operator/package-lock.json
      - run: npm ci
        working-directory: operator
      - name: Post mainnet NAV if due
        working-directory: operator
        env:
          NEAR_NETWORK: mainnet
          VAULT_CONTRACT_ID: 1f80f62c945eec98005dac38ab9db5f95c44ef1258cf5ca9606fb8c7dd4da36e
          OPERATOR_ACCOUNT_ID: c24664ec4591796ae1672b277dec9f211fb7e5bf63277598f07038b971f66bff
          DATA_DIR: ${{ runner.temp }}/keeper
          MIN_AGE_MINUTES: ${{ github.event.inputs.min_age_minutes || '210' }}
          KEEPER_POST_NAV_KEY: ${{ secrets.KEEPER_POST_NAV_KEY }}
          ATTESTATION_PRIVATE_KEY: ${{ secrets.MAINNET_ATTESTATION_KEY }}
          KEEPER_FILL_LOG: ${{ secrets.KEEPER_FILL_LOG }}
        run: KEEPER_MIN_AGE_MS=$(( MIN_AGE_MINUTES * 60000 )) npx tsx scripts/keeper.ts
