[package]
name = "sp-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Silent Partner open season: anyone files a vault launch (AI or human); the season operator deploys it. Also a sealed signal inbox for community leaders."

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
