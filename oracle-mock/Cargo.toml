[package]
name = "oracle-mock"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Testnet stand-in for pyth-oracle.near: same get_price_no_older_than interface, prices set by one writer."

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
