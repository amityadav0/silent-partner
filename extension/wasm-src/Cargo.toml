[package]
name = "silent-partner-tool"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "IronClaw WASM tools for Silent Partner leaders (structure adapted from Scope's extension)."

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.41.0"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
sha2 = "0.10"
bs58 = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
typecheck = []
